<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socio Command Center — Interactive Node Graph Canvas OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #06080d;
      --bg-surface: #0b0e17;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'Roboto Mono', monospace;
      --neon-yellow: #ccff00;
      --neon-cyan: #38bdf8;
      --neon-green: #10B981;
      --neon-red: #ef4444;
      --neon-purple: #a855f7;
    }

    body {
      background-color: var(--bg-base);
      color: #f8fafc;
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
      width: 100vw;
      height: 100vh;
    }

    .font-mono { font-family: var(--font-mono); }

    /* Infinite Dot Grid Canvas */
    #graph-canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #06080d;
      background-image: radial-gradient(rgba(56, 189, 248, 0.15) 1px, transparent 1px);
      background-size: 28px 28px;
      cursor: grab;
    }
    #graph-canvas-container:active {
      cursor: grabbing;
    }

    /* Draggable Node Card */
    .graph-node {
      position: absolute;
      background: rgba(13, 17, 27, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 35px -5px rgba(0, 0, 0, 0.8), 0 0 30px -10px rgba(56, 189, 248, 0.15);
      cursor: move;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.05s;
      z-index: 10;
    }
    .graph-node:hover {
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 15px 45px -5px rgba(0, 0, 0, 0.9), 0 0 45px -5px rgba(56, 189, 248, 0.3);
    }
    .graph-node.active-node {
      border-color: var(--neon-yellow) !important;
      box-shadow: 0 0 40px rgba(204, 255, 0, 0.35) !important;
    }

    /* Fighter Jet Floating HUD (Highest Z-Index) */
    .floating-hud {
      background: linear-gradient(180deg, rgba(17, 22, 35, 0.92) 0%, rgba(10, 13, 21, 0.95) 100%);
      border: 1px solid rgba(204, 255, 0, 0.35);
      border-radius: 20px;
      backdrop-filter: blur(24px);
      box-shadow: 0 0 50px -10px rgba(204, 255, 0, 0.2), 0 20px 40px rgba(0, 0, 0, 0.8);
      z-index: 40;
    }

    /* Animated Wire Path SVG */
    .wire-glow {
      stroke: rgba(56, 189, 248, 0.35);
      stroke-width: 2.5;
      fill: none;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }
    .wire-pulse {
      stroke: #ccff00;
      stroke-width: 3;
      stroke-dasharray: 8 16;
      animation: wireDash 1.5s linear infinite;
      fill: none;
      filter: drop-shadow(0 0 10px #ccff00);
    }
    @keyframes wireDash {
      to { stroke-dashoffset: -24; }
    }

    .pill {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pill-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .pill-blue { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }
    .pill-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .pill-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .pill-yellow { background: rgba(204, 255, 0, 0.15); color: #ccff00; border: 1px solid rgba(204, 255, 0, 0.35); }

    /* Slide-out Docks & Drawers */
    .dock-drawer {
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }
    .dock-drawer.open {
      transform: translateY(0);
    }

    .side-drawer {
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
    }
    .side-drawer.open {
      transform: translateX(0);
    }

    /* Custom Toast */
    .toast-deck {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast-msg {
      pointer-events: auto;
      background: #0d111b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 11px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body class="relative">

  <!-- ===================================================================
      LAYER 1: TOP GLOBAL BAR & COMMAND PALETTE (Z-Index 30)
      =================================================================== -->
  <header class="absolute top-0 left-0 right-0 h-14 border-b border-white/5 bg-[#06080d]/80 px-6 flex items-center justify-between backdrop-blur-xl z-30">
    <div class="flex items-center gap-3">
      <a href="index.html" class="flex items-center gap-1 text-base font-black tracking-tight text-white">
        Socio<span class="text-[#ccff00] drop-shadow-[0_0_8px_rgba(204,255,0,0.8)]">.</span>
      </a>
      <span class="pill pill-yellow hidden sm:inline-flex">NODE GRAPH CANVAS OS</span>
      <div class="h-3 w-px bg-white/10 hidden sm:block"></div>
      <div class="flex items-center gap-2 font-mono text-[11px] text-gray-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>8 AGENTS LIVE</span>
        <span class="text-slate-600">•</span>
        <span class="text-emerald-400 font-bold">🟢 LIVE POS SYNC</span>
      </div>
    </div>

    <!-- Center Command Search Bar -->
    <div class="flex-1 max-w-md mx-6">
      <div class="flex items-center gap-2 bg-[#0c101a] border border-white/10 rounded-xl px-3 py-1 focus-within:border-[#ccff00] transition-colors shadow-inner">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-[#ccff00]"></i>
        <input
          type="text"
          id="global-canvas-search"
          placeholder="Command agents or jump node... (e.g. 'Socio-Content', 'Governor') • ⌘K"
          class="bg-transparent border-none outline-none text-xs font-mono text-white w-full placeholder-gray-500"
          onkeydown="handleCanvasSearch(event)"
        >
        <span class="text-[9px] font-mono bg-white/5 px-1.5 py-0.5 rounded text-gray-400 border border-white/10">⌘K</span>
      </div>
    </div>

    <!-- Right HUD & View Toggles -->
    <div class="flex items-center gap-2">
      <button onclick="recenterGraph()" class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 transition-all flex items-center gap-1">
        <i data-lucide="scan" class="w-3.5 h-3.5"></i>
        <span>Recenter</span>
      </button>
      <button onclick="toggleHudCollapse()" class="px-2.5 py-1 rounded-lg text-xs font-mono font-bold bg-[#ccff00]/10 hover:bg-[#ccff00]/20 border border-[#ccff00]/30 text-[#ccff00] transition-all flex items-center gap-1" id="btn-hud-toggle">
        <i data-lucide="crosshair" class="w-3.5 h-3.5"></i>
        <span>HUD View</span>
      </button>
    </div>
  </header>

  <!-- ===================================================================
      LAYER 2: FIGHTER JET FLOATING HUD (TOP-CENTER, Z-Index 40)
      =================================================================== -->
  <div class="absolute top-18 left-1/2 -translate-x-1/2 w-full max-w-4xl px-4 z-40 transition-all duration-300" id="floating-hud-container">
    <div class="floating-hud p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-5 relative overflow-hidden">
      
      <!-- Left: Chief of Staff Directive -->
      <div class="space-y-1.5 min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <span class="p-1 rounded bg-[#ccff00]/10 text-[#ccff00]"><i data-lucide="sparkles" class="w-3.5 h-3.5"></i></span>
          <span class="text-[10px] font-mono font-extrabold uppercase tracking-widest text-[#ccff00]">AI CHIEF OF STAFF • NEXT BEST ACTION</span>
          <span class="pill pill-yellow">P0 HIGH ROI</span>
        </div>
        <h2 class="text-base sm:text-lg font-black text-white tracking-tight truncate">
          Approve East Harlem Bites Paid Campaign ($400 Budget)
        </h2>
        <div class="text-xs text-gray-300 font-mono flex items-center gap-3">
          <span>Impact: <strong class="text-emerald-400">+$4,400 Attributable Net Revenue</strong></span>
          <span class="text-slate-600">•</span>
          <span>ROAS: <strong class="text-sky-400">11x Validated</strong></span>
        </div>
      </div>

      <!-- Right: Direct Action Buttons -->
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="approveGovernorProposal('PROP-0042')" class="px-5 py-2.5 bg-[#ccff00] text-black font-extrabold font-mono text-xs rounded-xl hover:brightness-110 shadow-[0_0_15px_rgba(204,255,0,0.4)] flex items-center gap-1.5 transition-transform hover:scale-105">
          <i data-lucide="check" class="w-3.5 h-3.5"></i> Execute (+$4,400)
        </button>
        <button onclick="openEvidenceInspector('PROP-0042')" class="px-3 py-2.5 bg-white/5 hover:bg-white/10 text-gray-300 font-mono text-xs rounded-xl border border-white/10">
          Inspect Evidence
        </button>
      </div>

    </div>
  </div>

  <!-- ===================================================================
      LAYER 3: THE INFINITE INTERACTIVE NODE-GRAPH CANVAS (Z-Index 10)
      =================================================================== -->
  <div id="graph-canvas-container" onmousedown="startPan(event)">
    <svg id="svg-wires-layer" class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 5;"></svg>
    <div id="graph-world" class="absolute inset-0 origin-top-left"></div>
  </div>

  <!-- ===================================================================
      LAYER 4: BOTTOM DOCK & SLIDE-OUT CONTROLS (Z-Index 45)
      =================================================================== -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center gap-2 bg-[#0c101a]/90 border border-white/10 p-1.5 rounded-2xl backdrop-blur-2xl shadow-2xl">
    <button onclick="openDock('merchants')" class="px-3.5 py-2 rounded-xl text-xs font-mono font-bold text-gray-300 hover:text-white hover:bg-white/5 flex items-center gap-2 transition-colors">
      <i data-lucide="store" class="w-4 h-4 text-sky-400"></i>
      <span>Merchants (10)</span>
    </button>
    <button onclick="openDock('pipeline')" class="px-3.5 py-2 rounded-xl text-xs font-mono font-bold text-gray-300 hover:text-white hover:bg-white/5 flex items-center gap-2 transition-colors">
      <i data-lucide="kanban" class="w-4 h-4 text-purple-400"></i>
      <span>Pipeline ($42.1k)</span>
    </button>
    <button onclick="openDock('revenue')" class="px-3.5 py-2 rounded-xl text-xs font-mono font-bold text-gray-300 hover:text-white hover:bg-white/5 flex items-center gap-2 transition-colors">
      <i data-lucide="receipt" class="w-4 h-4 text-emerald-400"></i>
      <span>Revenue Ledger</span>
    </button>
    <button onclick="openDock('learning')" class="px-3.5 py-2 rounded-xl text-xs font-mono font-bold text-gray-300 hover:text-white hover:bg-white/5 flex items-center gap-2 transition-colors">
      <i data-lucide="brain" class="w-4 h-4 text-[#ccff00]"></i>
      <span>Learnings (2)</span>
    </button>
  </div>

  <!-- BOTTOM EXPANDABLE DRAWER PANEL -->
  <div id="bottom-dock-drawer" class="fixed inset-x-0 bottom-0 max-h-[70vh] h-[520px] bg-[#0c0f17] border-t border-white/10 p-6 dock-drawer shadow-[0_-20px_50px_rgba(0,0,0,0.9)] overflow-y-auto">
    <div class="flex items-center justify-between border-b border-white/5 pb-4 mb-4">
      <div class="flex items-center gap-2" id="dock-title-container">
        <i data-lucide="database" class="w-4 h-4 text-cyan-400"></i>
        <span class="text-xs font-mono uppercase tracking-widest text-white font-bold" id="dock-title">OPERATING DATA DRAWER</span>
      </div>
      <button onclick="closeDock()" class="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white">
        ✕
      </button>
    </div>
    <div id="dock-content-slot"></div>
  </div>

  <!-- RIGHT SIDE DETAIL INSPECTOR DRAWER -->
  <div id="side-inspector-drawer" class="fixed inset-y-0 right-0 w-full max-w-md bg-[#0c101a] border-l border-white/10 p-6 side-drawer shadow-2xl overflow-y-auto space-y-5">
    <div class="flex items-center justify-between border-b border-white/5 pb-4">
      <div class="flex items-center gap-2">
        <i data-lucide="shield-alert" class="w-4 h-4 text-cyan-400"></i>
        <span class="text-xs font-mono uppercase tracking-widest text-white font-bold" id="inspector-title">NODE TELEMETRY INSPECTOR</span>
      </div>
      <button onclick="closeInspector()" class="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-gray-400 hover:text-white">
        ✕
      </button>
    </div>
    <div id="inspector-content-slot" class="space-y-4 text-xs font-mono"></div>
  </div>

  <!-- Toast Deck -->
  <div class="toast-deck" id="toast-deck"></div>

  <!-- ===================================================================
      LAYER 5: NODE-GRAPH RUNTIME ENGINE & DRAGGABLE WIRE LOGIC
      =================================================================== -->
  <script>
    const API_BASE = window.location.origin;
    let authToken = localStorage.getItem('socio_merchant_token') || 'dev-token';

    /* =================================================================
       NODE DEFINITIONS (AGENTS, GOVERNOR, FOUNDER QUEUE, STORES)
       ================================================================= */
    const NODES = [
      // Central Control Nodes
      { id: 'governor', type: 'governor', title: 'Socio-Governor CAS', role: 'Safety & Approval Gate', x: 620, y: 320, width: 280, status: 'gated', badge: '3 PROPOSALS PENDING', emoji: '🛡️', color: '#f59e0b' },
      { id: 'queue', type: 'queue', title: 'Founder Action Queue', role: 'Scored Priority Tasks', x: 620, y: 560, width: 280, status: 'ready', badge: 'P0: +$4,400', emoji: '📋', color: '#ccff00' },
      
      // Autonomous Fleet Workers (Left & Right Flanks)
      { id: 'prospect', type: 'agent', title: 'Socio-Prospect', role: 'Lead Gen & NYC Scraping', x: 180, y: 160, width: 250, status: 'running', job: 'Scanning East Harlem Florists', rate: 88, emoji: '🕵️', color: '#38bdf8' },
      { id: 'pitch', type: 'agent', title: 'Socio-Pitch', role: 'Outreach & Sequences', x: 180, y: 340, width: 250, status: 'idle', job: 'WhatsApp VIP queue (T+48h)', rate: 71, emoji: '📣', color: '#f59e0b' },
      { id: 'onboard', type: 'agent', title: 'Socio-Onboard', role: 'Agreements & Twins', x: 180, y: 520, width: 250, status: 'online', job: 'DocuSign signed for El Nuevo Cafe', rate: 96, emoji: '📋', color: '#10B981' },
      { id: 'content', type: 'agent', title: 'Socio-Content', role: 'Content & Campaigns', x: 1040, y: 160, width: 250, status: 'running', job: '30-Day Reels Calendar + Paid Strike', rate: 94, emoji: '✍️', color: '#a855f7' },
      { id: 'listings', type: 'agent', title: 'Socio-Listings', role: 'Local SEO & Reviews', x: 1040, y: 340, width: 250, status: 'online', job: '12 Directory Sync for La Bodega', rate: 91, emoji: '📍', color: '#38bdf8' },
      { id: 'track', type: 'agent', title: 'Socio-Track', role: 'POS & Revenue Invoicing', x: 1040, y: 520, width: 250, status: 'online', job: 'Square webhook match #tx_8104a', rate: 99, emoji: '💳', color: '#10B981' }
    ];

    /* =================================================================
       INTER-NODE WIRE CONNECTIONS (EDGES & FLOW PATHS)
       ================================================================= */
    const WIRES = [
      { from: 'prospect', to: 'pitch', active: true, label: 'Qualified Leads' },
      { from: 'pitch', to: 'governor', active: true, pulse: true, label: 'PROP-0041 (Batch)' },
      { from: 'content', to: 'governor', active: true, pulse: true, label: 'PROP-0042 (Ad Budget)' },
      { from: 'governor', to: 'queue', active: true, pulse: true, label: 'Founder P0 Action' },
      { from: 'onboard', to: 'governor', active: false, label: 'Twin Inits' },
      { from: 'listings', to: 'governor', active: false, label: 'SEO Updates' },
      { from: 'track', to: 'governor', active: true, label: 'Revenue CAS Match' }
    ];

    // Canvas panning state
    let pan = { x: 0, y: 0 };
    let isPanning = false;
    let startPoint = { x: 0, y: 0 };
    let activeDragNode = null;
    let dragOffset = { x: 0, y: 0 };

    /* =================================================================
       RENDER GRAPH NODES & SVG WIRES
       ================================================================= */
    function initCanvas() {
      const world = document.getElementById('graph-world');
      if (!world) return;

      world.innerHTML = NODES.map(n => `
        <div
          id="node-${n.id}"
          class="graph-node p-4"
          style="left:${n.x}px; top:${n.y}px; width:${n.width}px;"
          onmousedown="startNodeDrag(event, '${n.id}')"
        >
          <div class="flex items-start justify-between mb-2">
            <div class="flex items-center gap-2">
              <span class="text-xl">${n.emoji}</span>
              <div>
                <div class="text-xs font-bold text-white font-mono">${n.title}</div>
                <div class="text-[10px] text-gray-400 font-mono">${n.role}</div>
              </div>
            </div>
            <span class="pill ${n.status === 'running' ? 'pill-blue' : n.status === 'online' ? 'pill-green' : 'pill-amber'}">
              ${n.status}
            </span>
          </div>

          <div class="p-2 rounded bg-black/40 border border-white/5 text-[11px] font-mono text-gray-300 mb-3">
            <div class="text-[9px] text-gray-500 uppercase">State / Job:</div>
            <div class="truncate text-white font-semibold mt-0.5">${n.job || n.badge}</div>
          </div>

          <div class="flex gap-2">
            ${n.type === 'agent' ? `
              <button onclick="triggerNodeAgent('${n.id}')" class="flex-1 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 text-[10px] font-mono font-bold rounded text-cyan-300">
                Trigger Run →
              </button>
            ` : n.type === 'governor' ? `
              <button onclick="openEvidenceInspector('PROP-0042')" class="flex-1 py-1.5 bg-[#ccff00]/10 hover:bg-[#ccff00]/20 border border-[#ccff00]/30 text-[10px] font-mono font-bold rounded text-[#ccff00]">
                Review 3 Props →
              </button>
            ` : `
              <button onclick="openDock('pipeline')" class="flex-1 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-[10px] font-mono font-bold rounded text-amber-300">
                Open Queue →
              </button>
            `}
            <button onclick="openInspectorNode('${n.id}')" class="px-2.5 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 text-[10px] font-mono rounded text-gray-300">
              Inspect
            </button>
          </div>
        </div>
      `).join('');

      drawWires();
      lucide.createIcons();
    }

    function drawWires() {
      const svg = document.getElementById('svg-wires-layer');
      if (!svg) return;

      svg.innerHTML = WIRES.map(w => {
        const fromNode = NODES.find(n => n.id === w.from);
        const toNode = NODES.find(n => n.id === w.to);
        if (!fromNode || !toNode) return '';

        // Calculate center anchor coordinates
        const x1 = fromNode.x + fromNode.width / 2 + pan.x;
        const y1 = fromNode.y + 70 + pan.y;
        const x2 = toNode.x + toNode.width / 2 + pan.x;
        const y2 = toNode.y + 70 + pan.y;

        // Smooth cubic bezier curve
        const dx = (x2 - x1) * 0.5;
        const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

        return `
          <g>
            <path d="${d}" class="wire-glow" />
            ${w.pulse ? `<path d="${d}" class="wire-pulse" />` : ''}
          </g>
        `;
      }).join('');
    }

    /* =================================================================
       DRAGGABLE NODE & CANVAS PANNING HANDLERS
       ================================================================= */
    function startNodeDrag(e, nodeId) {
      e.stopPropagation();
      activeDragNode = NODES.find(n => n.id === nodeId);
      if (!activeDragNode) return;

      const nodeEl = document.getElementById(`node-${nodeId}`);
      if (nodeEl) nodeEl.classList.add('active-node');

      dragOffset = {
        x: e.clientX - activeDragNode.x,
        y: e.clientY - activeDragNode.y
      };

      window.addEventListener('mousemove', onNodeDrag);
      window.addEventListener('mouseup', stopNodeDrag);
    }

    function onNodeDrag(e) {
      if (!activeDragNode) return;
      activeDragNode.x = e.clientX - dragOffset.x;
      activeDragNode.y = e.clientY - dragOffset.y;

      const nodeEl = document.getElementById(`node-${activeDragNode.id}`);
      if (nodeEl) {
        nodeEl.style.left = `${activeDragNode.x}px`;
        nodeEl.style.top = `${activeDragNode.y}px`;
      }
      drawWires();
    }

    function stopNodeDrag() {
      if (activeDragNode) {
        const nodeEl = document.getElementById(`node-${activeDragNode.id}`);
        if (nodeEl) nodeEl.classList.remove('active-node');
      }
      activeDragNode = null;
      window.removeEventListener('mousemove', onNodeDrag);
      window.removeEventListener('mouseup', stopNodeDrag);
    }

    function startPan(e) {
      if (e.target.closest('.graph-node')) return;
      isPanning = true;
      startPoint = { x: e.clientX - pan.x, y: e.clientY - pan.y };
      window.addEventListener('mousemove', onPan);
      window.addEventListener('mouseup', stopPan);
    }

    function onPan(e) {
      if (!isPanning) return;
      pan.x = e.clientX - startPoint.x;
      pan.y = e.clientY - startPoint.y;

      const world = document.getElementById('graph-world');
      if (world) world.style.transform = `translate(${pan.x}px, ${pan.y}px)`;
      drawWires();
    }

    function stopPan() {
      isPanning = false;
      window.removeEventListener('mousemove', onPan);
      window.removeEventListener('mouseup', stopPan);
    }

    function recenterGraph() {
      pan = { x: 0, y: 0 };
      const world = document.getElementById('graph-world');
      if (world) world.style.transform = `translate(0px, 0px)`;
      drawWires();
      toast('Canvas centered at origin.', 'success');
    }

    /* =================================================================
       ACTIONS & DRAWER CONTROLLERS
       ================================================================= */
    async function triggerNodeAgent(agentId) {
      toast(`Triggering Socio-${agentId}...`, 'warn');
      try {
        const res = await fetch(`${API_BASE}/api/agent/${agentId}/trigger`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
          body: JSON.stringify({ businessId: 'socio_default' })
        });
        const data = await res.json();
        toast(data.message || `Socio-${agentId} routine launched`, 'success');
      } catch (e) {
        toast(`Socio-${agentId} routine dispatched (dev mode)`, 'success');
      }
    }

    async function approveGovernorProposal(proposalId) {
      try {
        await fetch(`${API_BASE}/api/governor/${proposalId}/approve`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${authToken}` }
        });
      } catch(e) {}
      toast(`Proposal ${proposalId} APPROVED by Governor. Dispatched to fleet.`, 'success');
    }

    function openDock(dockType) {
      const drawer = document.getElementById('bottom-dock-drawer');
      const title = document.getElementById('dock-title');
      const slot = document.getElementById('dock-content-slot');
      if (!drawer || !slot) return;

      if (dockType === 'merchants') {
        title.innerText = 'NYC MERCHANT COHORT & TWIN MODELS';
        slot.innerHTML = `
          <table class="w-full text-left text-xs font-mono">
            <thead>
              <tr class="text-[10px] uppercase text-gray-500 border-b border-white/5">
                <th class="p-3">Store Name</th><th>Borough</th><th>Lifecycle</th><th>Assigned Agent</th><th>Attributed Rev</th><th>Health</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-white/5 text-gray-300">
              <tr><td class="p-3 font-bold text-white">Cristal Flowers</td><td>East Harlem</td><td><span class="pill pill-green">ACTIVE</span></td><td class="text-sky-400">Socio-Content</td><td class="text-emerald-400 font-bold">$4,820</td><td>94/100</td></tr>
              <tr><td class="p-3 font-bold text-white">El Nuevo Cafe</td><td>Wash. Heights</td><td><span class="pill pill-blue">ONBOARDING</span></td><td class="text-sky-400">Socio-Onboard</td><td class="text-emerald-400 font-bold">$0</td><td>88/100</td></tr>
              <tr><td class="p-3 font-bold text-white">East Harlem Bites</td><td>East Harlem</td><td><span class="pill pill-yellow">EXPANSION</span></td><td class="text-sky-400">Socio-Expand</td><td class="text-emerald-400 font-bold">$5,610</td><td>96/100</td></tr>
            </tbody>
          </table>
        `;
      } else if (dockType === 'revenue') {
        title.innerText = 'IMMUTABLE REVENUE PROOF LEDGER';
        slot.innerHTML = `
          <div class="grid grid-cols-4 gap-4 mb-4">
            <div class="p-3 rounded-xl bg-black/40 border border-white/5"><div class="text-[10px] text-gray-500 font-mono">Gross Recovered</div><div class="text-xl font-bold font-mono text-white">$22,890.00</div></div>
            <div class="p-3 rounded-xl bg-black/40 border border-white/5"><div class="text-[10px] text-gray-500 font-mono">Verified Delta</div><div class="text-xl font-bold font-mono text-sky-400">$15,870.00</div></div>
            <div class="p-3 rounded-xl bg-black/40 border border-white/5"><div class="text-[10px] text-gray-500 font-mono">Socio 15% Fee</div><div class="text-xl font-bold font-mono text-[#ccff00]">$2,380.50</div></div>
            <div class="p-3 rounded-xl bg-black/40 border border-white/5"><div class="text-[10px] text-gray-500 font-mono">Store Payout (85%)</div><div class="text-xl font-bold font-mono text-white">$13,489.50</div></div>
          </div>
        `;
      } else {
        title.innerText = '10-STAGE PIPELINE & STRIKES';
        slot.innerHTML = `<div class="p-4 rounded-xl bg-black/40 text-xs font-mono text-gray-300">Weighted Pipeline: $42,180 across 10 NYC deals. Automated SLAs active.</div>`;
      }

      drawer.classList.add('open');
      lucide.createIcons();
    }
    function closeDock() {
      const drawer = document.getElementById('bottom-dock-drawer');
      if (drawer) drawer.classList.remove('open');
    }

    function openInspectorNode(nodeId) {
      const n = NODES.find(x => x.id === nodeId);
      const drawer = document.getElementById('side-inspector-drawer');
      const title = document.getElementById('inspector-title');
      const slot = document.getElementById('inspector-content-slot');
      if (!n || !drawer || !slot) return;

      title.innerText = `${n.title} TELEMETRY`;
      slot.innerHTML = `
        <div class="p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400">
          <div class="text-[10px] uppercase font-bold">Node State: ${n.status}</div>
          <div class="text-sm font-bold text-white mt-1">${n.job || n.role}</div>
        </div>
        <div class="p-3 rounded-xl bg-black/40 border border-white/5 space-y-2">
          <div class="flex justify-between"><span class="text-gray-500">Node ID:</span><span class="text-white">${n.id}</span></div>
          <div class="flex justify-between"><span class="text-gray-500">Execution Rate:</span><span class="text-emerald-400 font-bold">${n.rate || 95}%</span></div>
          <div class="flex justify-between"><span class="text-gray-500">Heartbeat:</span><span class="text-gray-300">12s ago</span></div>
        </div>
      `;
      drawer.classList.add('open');
      lucide.createIcons();
    }
    function closeInspector() {
      const drawer = document.getElementById('side-inspector-drawer');
      if (drawer) drawer.classList.remove('open');
    }

    function openEvidenceInspector(propId) {
      openInspectorNode('governor');
    }

    function toggleHudCollapse() {
      const hud = document.getElementById('floating-hud-container');
      if (hud) hud.classList.toggle('opacity-0');
    }

    function handleCanvasSearch(e) {
      if (e.key === 'Enter') {
        const val = e.target.value.trim().toLowerCase();
        const matched = NODES.find(n => n.id.includes(val) || n.title.toLowerCase().includes(val));
        if (matched) {
          pan.x = window.innerWidth / 2 - (matched.x + matched.width / 2);
          pan.y = window.innerHeight / 2 - (matched.y + 70);
          const world = document.getElementById('graph-world');
          if (world) world.style.transform = `translate(${pan.x}px, ${pan.y}px)`;
          drawWires();
          toast(`Focused on node ${matched.title}`, 'success');
        }
        e.target.value = '';
      }
    }

    function toast(msg, type = 'success') {
      const deck = document.getElementById('toast-deck');
      if (!deck) return;
      const t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `
        <span class="${type === 'warn' ? 'text-amber-400' : 'text-emerald-400'} font-bold">${type === 'warn' ? '⚠️' : '✓'}</span>
        <span class="text-gray-200">${msg}</span>
      `;
      deck.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
    });
  </script>
</body>
</html>
