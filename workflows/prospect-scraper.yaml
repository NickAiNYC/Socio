workflow:
  name: socio-prospect-scraper-daily
  trigger:
    type: cron
    schedule: "0 6 * * *"
  steps:
    - name: scrape-harlem
      agent: dsh-plugin-subagents
      params:
        tool: google-maps-api
        query: "florists in East Harlem, NYC"
    - name: scrape-washington-heights
      agent: dsh-plugin-subagents
      params:
        tool: google-maps-api
        query: "florists in Washington Heights, NYC"
    - name: scrape-bronx
      agent: dsh-plugin-subagents
      params:
        tool: google-maps-api
        query: "florists in Bronx, NYC"
    - name: scrape-queens
      agent: dsh-plugin-subagents
      params:
        tool: google-maps-api
        query: "florists in Queens, NYC"
    - name: merge-results
      agent: dsh-plugin-subagents
      tool: merge-json
    - name: score-prospects
      agent: dsh-plan-execute
      params: "Apply Socio scoring algorithm to identify top 10 merchants based on digital footprint gaps."
