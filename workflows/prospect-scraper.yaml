workflow:
  name: socio-prospect-scraper-daily
  trigger:
    type: cron
    schedule: "0 6 * * *"
  description: >
    Density-aware corridor scan -> Digital Gap scoring (model v1) -> capped,
    consented prospect packet for Socio-Pitch. Read-only gather + score:
    no external effects, so no Governor approval is required for the scan
    itself. Any OUTREACH that follows is a separate governed action by
    Socio-Pitch via growth_os_propose_action.
  steps:
    - name: scan-corridor
      agent: dsh-exec
      params:
        command: node
        args:
          - engines/prospect/cli.mjs
          - --area "east harlem"
          - --vertical florist
          - --limit 10
          - --min-score 40
      note: >
        Uses density-aware grid search (breaks the 60-result Places limit).
        Without GOOGLE_MAPS_API_KEY it runs in labeled demo mode (demo:true).
    - name: rotate-corridor
      agent: dsh-exec
      params:
        command: node
        args:
          - engines/prospect/cli.mjs
          - --area "washington heights"
          - --vertical florist
          - --limit 10
          - --min-score 40
      note: Own one corridor at a time — East Harlem -> Washington Heights ->
        Bronx -> Astoria weekly rotation.
    - name: score-and-cap
      agent: socio-prospect
      tool: prospect_score_batch
      params:
        area: "East Harlem, NYC"
        vertical: florist
        limit: 10
        minScore: 40
      note: >
        First-class Growth OS MCP tool. Enforces the Manifesto cap (max 12)
        and only surfaces records above the leakage threshold.
    - name: record-packet
      agent: socio-prospect
      tool: prospect_commit_packet
      params:
        packetPath: "outputs/prospects/{{ date }}.json"
        businessId: socio_default
        agentId: socio-prospect
      note: >
        Validates the packet (kind = socio-prospect-packet) and records one
        lead_created event per selected prospect — score, gaps, coverage and
        recoverable-revenue estimate as metadata — into the Growth OS ledger.
        Non-financial, no Governor approval needed. The packet FILE stays the
        single handoff artifact to Pitch; the ledger makes the handoff auditable.
    - name: handoff-to-pitch
      agent: socio-pitch
      params:
        packet: "outputs/prospects/{{ date }}.json"
      note: >
        Pitch consumes ONLY the scored, capped packet. First outreach action
        must go through growth_os_propose_action -> approved -> execute.
